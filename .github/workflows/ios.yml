name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 25

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20
          swift --version

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -only-testing:"Rclone GUITests" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

  archive-dry-run:
    name: Archive (dry run, unsigned)
    runs-on: macos-15
    timeout-minutes: 25
    needs: build-and-test

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build generic iOS device archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RcloneGUI-CI.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify archive structure
        run: |
          # PRODUCT_NAME = RcloneGUI → l'app archivée est RcloneGUI.app.
          APP="build/RcloneGUI-CI.xcarchive/Products/Applications/RcloneGUI.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: archive missing the .app bundle"
            ls -la "build/RcloneGUI-CI.xcarchive/Products/Applications/" || true
            exit 1
          fi
          echo "Archive structure OK"
          du -sh "build/RcloneGUI-CI.xcarchive"

  build-macos:
    name: Build (macOS, unsigned)
    # Garde de non-régression : l'app cible aussi macOS, mais seul le simulateur
    # iOS était vérifié en CI. Des API iOS-only non gardées (ex. Handoff :
    # textInputAutocapitalization, UIPasteboard, UIActivityViewController) ne
    # cassaient donc qu'à l'archive macOS Xcode Cloud. Ce job compile la cible
    # macOS à chaque PR pour attraper ces régressions plus tôt.
    runs-on: macos-15
    timeout-minutes: 25

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for macOS (compile check, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

  build-unsigned-ipa:
    name: Unsigned IPA (artifact)
    # Produit une IPA non signée (Payload/.app zippé, aucun certificat requis)
    # et la publie dans les artifacts du run, pour sideload / QA interne.
    # Frameworks/RcloneKit.xcframework est gitignore : il est reconstruit ici
    # via scripts/build-rclone.sh (lit la cible iOS déployée dans le pbxproj),
    # sinon le link du target app échoue.
    # Pas déclenché sur PR : le build gomobile ajoute ~20 min par run.
    # Pas de `needs:` : ce job construit lui-même le framework et reste
    # utile (livrable QA) même si le job de tests est rouge.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI
      ARCHIVE_PATH: build/RcloneGUI-unsigned.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # Les images macos-15 livrent plusieurs Xcodes ; le projet utilise
          # des réglages Xcode 26+ (SWIFT_DEFAULT_ACTOR_ISOLATION…) → prendre
          # le plus récent disponible.
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build RcloneKit.xcframework
        run: ./scripts/build-rclone.sh

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          APP="$ARCHIVE_PATH/Products/Applications/RcloneGUI.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: archive missing the .app bundle"
            ls -la "$ARCHIVE_PATH/Products/Applications/" || true
            exit 1
          fi
          mkdir -p build/export/Payload
          ditto "$APP" "build/export/Payload/RcloneGUI.app"
          cd build/export
          zip -qry RcloneGUI-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          IPA="build/export/RcloneGUI-unsigned.ipa"
          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA not produced"
            exit 1
          fi
          unzip -l "$IPA" | grep -q "Payload/RcloneGUI.app/" || {
            echo "ERROR: malformed IPA (Payload/RcloneGUI.app missing)"
            exit 1
          }
          echo "IPA OK"
          du -sh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RcloneGUI-unsigned-ipa-${{ github.sha }}
          path: build/export/RcloneGUI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  transparency-guard:
    name: Glass Engine — garde « 0 appel maison »
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier « 0 appel maison » (scan source, sans build)
        run: ./scripts/verify-no-phone-home.sh

  reproducible-build:
    name: Build reproductible (empreinte RcloneKit.xcframework)
    # Lourd (~20 min, build gomobile). Déclenché à la main uniquement — informatif,
    # ne bloque pas les PR. Le mainteneur régénère le manifeste via
    # `scripts/verify-reproducible.sh --record` après un build propre.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Rebuild du framework natif (déterministe)
        run: ./scripts/build-rclone.sh

      - name: Empreintes + garde 0 appel maison
        run: ./scripts/verify-reproducible.sh
