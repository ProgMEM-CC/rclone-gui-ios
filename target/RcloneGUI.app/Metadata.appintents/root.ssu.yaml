apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.rougetet.rclone-gui
    intents:
    - metadata:
        name: ListRemotesIntent_0
        title: Liste les remotes rclone
      corpuses:
        training:
        - locale: it
          utterances:
          - '{${+prefix} }Elenca i miei remote ${+applicationName}'
          - '{${+prefix} }Mostra i remote ${+applicationName}'
        - locale: fr
          utterances:
          - '{${+prefix} }Liste mes remotes ${+applicationName}'
          - '{${+prefix} }Affiche les remotes ${+applicationName}'
        - locale: pt-BR
          utterances:
          - '{${+prefix} }Mostrar remotes do ${+applicationName}'
          - '{${+prefix} }Listar meus remotes do ${+applicationName}'
