          utterances:
          - '{${+prefix} }내 ${+applicationName} 원격 목록'
          - '{${+prefix} }${+applicationName} 원격 보기'
        - locale: en
          utterances:
          - '{${+prefix} }List my remotes ${+applicationName}'
        - locale: zh-Hant
          utterances:
          - 列出我的 ${+applicationName} 遠端
          - 顯示 ${+applicationName} 遠端
